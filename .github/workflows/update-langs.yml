name: Update GitHub Stats Dashboard

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate GitHub Dashboard SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/generate_dashboard.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg languages.svg languages-chart.svg
          if git diff --staged --quiet; then
            echo "No changes in dashboard stats"
          else
            git commit -m "chore: update GitHub dashboard stats"
            git push
          fi
